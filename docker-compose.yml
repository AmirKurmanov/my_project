services:
  db:
    image: postgres:15-alpine
    container_name: robopodbor-db
    environment:
      POSTGRES_DB: robopodbor
      POSTGRES_USER: robopodbor
      POSTGRES_PASSWORD: robopodbor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robopodbor"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: robopodbor-backend
    environment:
      DATABASE_URL: postgresql://robopodbor:robopodbor@db:5432/robopodbor
      SECRET_KEY: hackathon-secret-key-2024-robopodbor
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: robopodbor-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
